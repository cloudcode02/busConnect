<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>admin-log-in</title>
     <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="css/admin-log-in.css">
</head>
<body>
    <div class="bg-grid"></div>
  <div class="bg-glow"></div>
  <div class="bg-glow2"></div>

  <div class="login-card">
    <div class="logo-row">
      <div class="logo-icon">🚌</div>
      <div class="logo-text">Bus<span>Connect</span></div>
    </div>
    <div class="admin-badge">Admin Portaal</div>
    <h1>Welkom terug</h1>
    <p class="subtitle">Log in om het dashboard te beheren</p>
    <div class="error-msg" id="error-msg">❌ Ongeldig e-mailadres of wachtwoord.</div>
    <div class="field">
      <label>E-mailadres</label>
      <input type="email" id="email" placeholder="admin@busconnect.sr" autocomplete="email"/>
    </div>
    <div class="field">
      <label>Wachtwoord</label>
      <input type="password" id="password" placeholder="••••••••" autocomplete="current-password"/>
    </div>
    <button class="btn-login" id="login-btn" onclick="login()">
      <span id="btn-text">Inloggen →</span>
      <div class="spinner" id="spinner"></div>
    </button>
    <p class="footer-note">Alleen bevoegde administrators hebben toegang.</p>
  </div>
<script src="js/admin-log-in.js"></script>
</body>
</html>
