<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BusConnect — Admin Login</title>
  <link rel="icon" href="buslogo.png"/>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0f1117; --surface: #181c27; --border: #2a2f3e;
      --amber: #f5a623; --amber-dark: #c47f0a; --text: #eef0f6;
      --muted: #7a8099; --danger: #e05252; --radius: 14px;
    }
    body {
      font-family: 'DM Sans', sans-serif; background: var(--bg);
      color: var(--text); min-height: 100vh; display: flex;
      align-items: center; justify-content: center; overflow: hidden;
    }
    .bg-grid {
      position: fixed; inset: 0;
      background-image: linear-gradient(rgba(245,166,35,0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(245,166,35,0.04) 1px, transparent 1px);
      background-size: 40px 40px; z-index: 0;
    }
    .bg-glow {
      position: fixed; width: 500px; height: 500px; border-radius: 50%;
      background: radial-gradient(circle, rgba(245,166,35,0.12) 0%, transparent 70%);
      top: -100px; right: -100px; z-index: 0; animation: pulse 4s ease-in-out infinite;
    }
    .bg-glow2 {
      position: fixed; width: 400px; height: 400px; border-radius: 50%;
      background: radial-gradient(circle, rgba(100,120,255,0.08) 0%, transparent 70%);
      bottom: -80px; left: -80px; z-index: 0; animation: pulse 5s ease-in-out infinite reverse;
    }
    @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.1); opacity: 0.7; } }
    .login-card {
      position: relative; z-index: 1; background: var(--surface);
      border: 1px solid var(--border); border-radius: 24px; padding: 3rem 2.5rem;
      width: 100%; max-width: 420px; box-shadow: 0 40px 80px rgba(0,0,0,0.5);
      animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) both;
    }
    @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
    .logo-row { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 2rem; }
    .logo-icon { width: 44px; height: 44px; background: var(--amber); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.4rem; }
    .logo-text { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 1.3rem; color: var(--text); }
    .logo-text span { color: var(--amber); }
    .admin-badge { display: inline-block; background: rgba(245,166,35,0.12); color: var(--amber); border: 1px solid rgba(245,166,35,0.25); font-size: 0.72rem; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; padding: 3px 10px; border-radius: 99px; margin-bottom: 1rem; }
    h1 { font-family: 'Syne', sans-serif; font-size: 1.8rem; font-weight: 800; margin-bottom: 0.4rem; line-height: 1.2; }
    .subtitle { color: var(--muted); font-size: 0.9rem; margin-bottom: 2rem; }
    .field { margin-bottom: 1.2rem; }
    label { display: block; font-size: 0.82rem; font-weight: 500; color: var(--muted); margin-bottom: 0.5rem; letter-spacing: 0.03em; }
    input { width: 100%; background: rgba(255,255,255,0.04); border: 1px solid var(--border); border-radius: var(--radius); padding: 0.85rem 1rem; color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 0.95rem; transition: border-color 0.2s, box-shadow 0.2s; outline: none; }
    input:focus { border-color: var(--amber); box-shadow: 0 0 0 3px rgba(245,166,35,0.12); }
    input::placeholder { color: var(--muted); }
    .btn-login { width: 100%; background: var(--amber); color: #0f1117; border: none; border-radius: var(--radius); padding: 0.95rem; font-family: 'Syne', sans-serif; font-size: 1rem; font-weight: 700; cursor: pointer; margin-top: 0.5rem; transition: background 0.2s, transform 0.1s; display: flex; align-items: center; justify-content: center; gap: 0.5rem; }
    .btn-login:hover { background: #f0b93a; }
    .btn-login:active { transform: scale(0.98); }
    .btn-login:disabled { opacity: 0.6; cursor: not-allowed; }
    .error-msg { background: rgba(224,82,82,0.1); border: 1px solid rgba(224,82,82,0.3); color: #f08080; border-radius: 10px; padding: 0.75rem 1rem; font-size: 0.87rem; margin-bottom: 1rem; display: none; }
    .error-msg.show { display: block; }
    .spinner { width: 18px; height: 18px; border: 2px solid rgba(15,17,23,0.3); border-top-color: #0f1117; border-radius: 50%; animation: spin 0.7s linear infinite; display: none; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .footer-note { text-align: center; margin-top: 1.5rem; color: var(--muted); font-size: 0.8rem; }
  </style>
</head>
<body>
  <div class="bg-grid"></div>
  <div class="bg-glow"></div>
  <div class="bg-glow2"></div>

  <div class="login-card">
    <div class="logo-row">
      <div class="logo-icon">🚌</div>
      <div class="logo-text">Bus<span>Connect</span></div>
    </div>
    <div class="admin-badge">Admin Portaal</div>
    <h1>Welkom terug</h1>
    <p class="subtitle">Log in om het dashboard te beheren</p>
    <div class="error-msg" id="error-msg">❌ Ongeldig e-mailadres of wachtwoord.</div>
    <div class="field">
      <label>E-mailadres</label>
      <input type="email" id="email" placeholder="admin@busconnect.sr" autocomplete="email"/>
    </div>
    <div class="field">
      <label>Wachtwoord</label>
      <input type="password" id="password" placeholder="••••••••" autocomplete="current-password"/>
    </div>
    <button class="btn-login" id="login-btn" onclick="login()">
      <span id="btn-text">Inloggen →</span>
      <div class="spinner" id="spinner"></div>
    </button>
    <p class="footer-note">Alleen bevoegde administrators hebben toegang.</p>
  </div>

  <script>
    // Tijdelijk: sla direct een token op en ga naar dashboard
    localStorage.setItem('admin_token', 'test-token-123');
    window.location.href = 'admin-dashboard.html';

    async function login() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const btn = document.getElementById('login-btn');
      const spinner = document.getElementById('spinner');
      const btnText = document.getElementById('btn-text');
      const errorMsg = document.getElementById('error-msg');

      if (!email || !password) {
        errorMsg.textContent = '❌ Vul e-mailadres en wachtwoord in.';
        errorMsg.classList.add('show');
        return;
      }

      btn.disabled = true;
      spinner.style.display = 'block';
      btnText.textContent = 'Bezig...';
      errorMsg.classList.remove('show');

      try {
        const res = await fetch('/api/auth/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (res.ok && data.token) {
          localStorage.setItem('admin_token', data.token);
          window.location.href = 'admin-dashboard.html';
        } else {
          errorMsg.textContent = '❌ ' + (data.bericht || 'Inloggen mislukt.');
          errorMsg.classList.add('show');
        }
      } catch (err) {
        errorMsg.textContent = '❌ Kan geen verbinding maken met de server.';
        errorMsg.classList.add('show');
      } finally {
        btn.disabled = false;
        spinner.style.display = 'none';
        btnText.textContent = 'Inloggen →';
      }
    }
  </script>
</body>
</html>
